<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1050" viewBox="0 0 1240 1050" role="img" aria-label="ESP32: реле вентилятора, MOSFET светильника и XGZP6847D">
<style>text{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;fill:#25282d;font-size:17px}.title{font-size:29px;font-weight:700}.name{font-size:23px;font-weight:700}.small{font-size:14px;fill:#626973}.pin{font-family:monospace;font-size:17px}.box{fill:white;stroke:#dce1e7;stroke-width:2}.wire{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
