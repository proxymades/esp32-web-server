<title>ESP32 · Панель управления</title>
<style>
:root{color-scheme:light;--bg:#f3f4f5;--ink:#25282d;--muted:#626973;--line:#e4e7eb;--blue:#008ee8;--amber:#ffbc00;--green:#43bf1b;--red:#ff414b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button{font:inherit}svg{display:block;width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}[hidden]{display:none!important}
.shell{max-width:1104px;margin:auto;padding:0 32px}.topbar{height:96px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dfe4ee;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:42px;height:42px;border-radius:13px;background:var(--ink);color:#fff;display:grid;place-items:center}.brand-mark svg{width:25px;height:25px}.brand-name{font-weight:800;font-size:19px;letter-spacing:-.6px}.brand-name span{color:#8a93a5;font-weight:450}
main{padding:42px 0 24px}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:27px}h1{margin:0;font-size:clamp(27px,3.4vw,40px);line-height:1.18;letter-spacing:-1.45px;font-weight:750}.stats{background:#fff;color:var(--ink);border:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);border-radius:20px;padding:24px 8px;margin-bottom:32px;box-shadow:0 10px 22px #202b4310}.stat{padding:0 26px;border-right:1px solid var(--line);display:grid;grid-template-columns:1fr 32px;gap:10px}.stat:last-child{border:0}.stat-label{display:block;font-size:11px;color:#626973;line-height:1.4}.stat-icon{grid-column:2;grid-row:1/3;width:30px;height:30px;display:grid;place-items:center;border:1px solid #e8eaee;border-radius:9px;color:#8b929c}.stat-icon svg{width:16px;height:16px}.stat-value{font-size:28px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.8px;line-height:1.2}.stat-value small{font-size:13px;color:#626973;font-weight:400;letter-spacing:0}.stat-value.uptime{font-size:26px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 15px}h2{margin:0;font-size:15px;font-weight:750;letter-spacing:-.2px}.controls,.readings{display:grid;grid-template-columns:1fr 1fr;gap:18px}.relay{--accent:var(--blue);position:relative;overflow:hidden;background:white;border:1px solid var(--line);border-radius:22px;padding:25px 27px;box-shadow:0 4px 14px #1e2e4a03;transition:border-color .2s,box-shadow .2s}.relay.light{--accent:var(--amber)}.relay.on{border-color:var(--accent)}.card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.equipment-icon{color:#fff;background:var(--accent);width:53px;height:53px;display:grid;place-items:center;border-radius:17px}.equipment-icon svg{width:29px;height:29px}.relay-name{margin:0 0 7px;font-size:22px;letter-spacing:-.65px;font-weight:700}.relay-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:25px;padding-top:20px;border-top:1px solid #edf0f5;gap:15px}.relay-state{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:650;color:#7b8597}.on .relay-state{color:var(--ink)}.toggle{-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;position:relative;display:flex;align-items:center;gap:11px;padding:4px 0 4px 8px;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;min-height:44px}.track{position:relative;display:block;width:62px;height:34px;border-radius:100px;background:#c9cdd2;transition:background .2s;box-shadow:inset 0 1px 3px #1725400b}.knob{position:absolute;left:4px;top:4px;width:26px;height:26px;display:grid;place-items:center;background:white;color:#9ba5b7;box-shadow:0 2px 4px #1b2a4526;border-radius:100px;transition:transform .2s,color .2s}.knob svg{width:13px;height:13px;stroke-width:2.2}.toggle[aria-checked="true"] .track{background:var(--accent)}.toggle[aria-checked="true"] .knob{transform:translateX(28px);color:var(--accent)}.toggle:disabled{cursor:wait}.toggle:disabled:not([aria-busy="true"]){opacity:.48}.toggle:focus-visible{outline:3px solid var(--accent);outline-offset:6px;border-radius:20px}.toggle:hover:not(:disabled) .track{filter:brightness(.97)}
.sensor-section{margin-top:30px}.reading{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;background:white;border:1px solid var(--line);padding:22px 27px;border-radius:20px}.reading-label{font-size:12px;color:var(--muted);margin:0 0 9px}.reading-value{font-size:38px;font-weight:650;line-height:1.15;letter-spacing:-1.3px;font-variant-numeric:tabular-nums}.reading-value small{font-size:17px;font-weight:450;letter-spacing:0;color:#626973;margin-left:7px}.reading-note{margin:10px 0 0;color:#8d96a7;font-size:10px;line-height:1.5}.reading-icon{width:46px;height:46px;border-radius:15px;background:#1abcca;color:#fff;display:grid;place-items:center}.reading.temperature .reading-icon{background:#ff414b;color:#fff}.sensor-error{margin:0 0 14px;font-size:13px;color:#c92531}.alert{margin:0 0 20px;border:1px solid #eccfd5;border-radius:12px;padding:12px 16px;background:#fff0f3;color:#a53e51;font-size:12px;line-height:1.6}
.clexhub{display:flex;align-items:center;flex-shrink:0}.clexhub-logo{display:block;width:180px;height:auto}
@media(min-width:1400px){.shell{max-width:1170px}main{padding-top:52px}.stats{margin-top:34px}.relay{padding:29px 30px}.card-top{margin-bottom:32px}.relay-bottom{margin-top:29px}.reading{padding:25px 30px}}
@media(max-width:650px){.clexhub-logo{width:120px}.shell{padding:0 20px}.topbar{height:76px}.brand-mark{width:36px;height:36px;border-radius:11px}.brand-name{font-size:16px;line-height:1.3}.brand-name span{display:block;font-size:11px;letter-spacing:0}.brand-mark{flex-shrink:0}.brand{gap:9px}main{padding-top:29px}.heading{align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:22px}h1{font-size:30px;letter-spacing:-1.2px;max-width:300px}.stats{padding:20px 0;border-radius:17px;margin-bottom:26px}.stat{padding:0 14px;display:block}.stat-icon{display:none}.stat-label{display:block;font-size:9px;min-height:27px}.stat-value{font-size:24px;letter-spacing:-.5px}.stat-value.uptime{font-size:20px;line-height:1.45}.stat-value small{font-size:10px}.controls{grid-template-columns:1fr;gap:13px}.relay{padding:22px;border-radius:19px}.card-top{margin-bottom:21px}.equipment-icon{width:46px;height:46px;border-radius:14px}.equipment-icon svg{width:26px;height:26px}.relay-name{font-size:21px}.relay-bottom{margin-top:20px;padding-top:15px}.sensor-section{margin-top:26px}.readings{gap:12px}.reading{display:block;padding:18px 17px;border-radius:17px}.reading-icon{position:absolute;right:15px;top:15px;width:24px;height:24px;border-radius:7px}.reading-icon svg{width:15px;height:15px}.reading-label{font-size:10px;margin-bottom:12px;padding-right:22px}.reading-value{font-size:29px;letter-spacing:-.8px;white-space:nowrap}.reading-value small{font-size:12px;margin-left:3px}.reading-note{font-size:9px}h2{font-size:14px}}
@media(max-width:359px){.shell{padding:0 14px}.stat{padding:0 11px}.stat-value.uptime{font-size:18px}.reading{padding:17px 12px}.reading-value{font-size:25px}.reading-icon{right:11px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
'use strict';
const el = id => document.getElementById(id);
let state = null;
let connected = false;
const pendingCommands = new Set();
let queue = Promise.resolve();
const numbers = new Intl.NumberFormat('ru-RU');
const pressureFormat = new Intl.NumberFormat('ru-RU', {minimumFractionDigits:3, maximumFractionDigits:3});
const temperatureFormat = new Intl.NumberFormat('ru-RU', {minimumFractionDigits:1, maximumFractionDigits:1});
function uptime(seconds) {
 const days = Math.floor(seconds / 86400);
 const parts = [Math.floor(seconds / 3600) % 24, Math.floor(seconds / 60) % 60, seconds % 60];
 return (days ? days + ' д ' : '') + parts.map(value => String(value).padStart(2, '0')).join(':');
}
function updateButtons() {
 for (const id of ['fan', 'light']) {
  const button = el(id + '-toggle');
  const busy = pendingCommands.has(id);
  const disabled = !connected || busy;
  if (button.disabled !== disabled) button.disabled = disabled;
  if (button.getAttribute('aria-busy') !== String(busy)) button.setAttribute('aria-busy', String(busy));
 }
}
function setConnected(value) {
 connected = value;
 el('connection-error').hidden = value;
 updateButtons();
 if (!value) {
  for (const id of ['fan', 'light']) {
   el(id + '-card').classList.remove('on');
   el(id + '-state').textContent = 'Нет связи';
   el(id + '-toggle').setAttribute('aria-checked', 'false');
  }
  el('pressure').textContent = '-';
  el('temperature').textContent = '-';
  el('sensor-error').hidden = true;
 }
}
function render(data) {
 if (!Number.isFinite(data.uptime_s) || typeof data.fan !== 'boolean' || typeof data.light !== 'boolean') throw new Error('Invalid state');
 state = data;
 el('clients').textContent = numbers.format(data.clients);
 el('uptime').textContent = uptime(data.uptime_s);
 el('commands').textContent = numbers.format(data.commands);
 for (const id of ['fan', 'light']) {
  const card = el(id + '-card');
  const button = el(id + '-toggle');
  const status = data[id] ? 'Включено' : 'Выключено';
  const action = data[id] ? 'Выключить' : 'Включить';
  const checked = String(data[id]);
  if (card.classList.contains('on') !== data[id]) card.classList.toggle('on', data[id]);
  if (el(id + '-state').textContent !== status) el(id + '-state').textContent = status;
  if (button.getAttribute('aria-checked') !== checked) button.setAttribute('aria-checked', checked);
  if (el(id + '-action').textContent !== action) el(id + '-action').textContent = action;
 }
 el('sensor-section').hidden = data.sensor_enabled === false;
 const valid = data.sensor_ok && Number.isFinite(data.pressure_bar) && Number.isFinite(data.temperature_c);
 el('pressure').textContent = valid ? pressureFormat.format(data.pressure_bar) : '-';
 el('temperature').textContent = valid ? temperatureFormat.format(data.temperature_c) : '-';
 const sensorErrors = {
  ESP_ERR_NOT_FOUND: 'XGZP6847D не отвечает по I²C (0x6D).',
  ESP_ERR_TIMEOUT: 'Таймаут I²C. Нет данных XGZP6847D.',
  ESP_ERR_INVALID_RESPONSE: 'Ошибка ответа XGZP6847D по I²C.',
  ESP_ERR_INVALID_STATE: 'Ошибка состояния шины I²C.',
  ESP_ERR_NOT_FINISHED: 'Ожидание показаний XGZP6847D.'
 };
 el('sensor-error').textContent = sensorErrors[data.sensor_error] || 'Нет данных датчика.';
 el('sensor-error').hidden = valid;
 setConnected(true);
}
function request(path, options = {}) {
 // Опрос и команды выполняются последовательно, чтобы старый ответ не заменил результат команды.
 const operation = queue.then(async () => {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 3000);
  try {
   const response = await fetch(path, {...options, cache:'no-store', signal:controller.signal});
   if (!response.ok) throw new Error('HTTP ' + response.status);
   render(await response.json());
  } catch (error) {
   setConnected(false);
   throw error;
  } finally { clearTimeout(timer); }
 });
 queue = operation.catch(() => {});
 return operation;
}
async function poll() {
 try { await request('/api/state'); } catch (_) { /* Следующая попытка выполняется ниже. */ }
 setTimeout(poll, 500);
}
async function control(id) {
 if (!connected || !state || pendingCommands.has(id)) return;
 const on = state[id] ? 0 : 1;
 pendingCommands.add(id);
 updateButtons();
 el('error').hidden = true;
 try {
  // Отправляется заданное состояние. Команда без подтверждения автоматически не повторяется.
  await request('/api/relay?id=' + id + '&on=' + on, {method:'POST'});
 } catch (_) {
  el('error').textContent = 'Не удалось подтвердить команду. Состояние обновится после восстановления связи.';
  el('error').hidden = false;
 } finally {
  pendingCommands.delete(id);
  updateButtons();
 }
}
for (const id of ['fan', 'light']) el(id + '-toggle').addEventListener('click', () => control(id));
poll();
</script>
</body>
